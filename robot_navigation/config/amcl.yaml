amcl:
  ros__parameters:

    use_sim_time: true

    # Frames
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"

    # Topics
    scan_topic: scan
    map_topic: map

    # AMCL motion model
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Odometry noise — increase rotation-related terms so the filter
    # has enough spread to actually correct heading drift via scan matching
    alpha1: 0.1    # was 0.05 — rotation noise from rotation
    alpha2: 0.1    # was 0.05 — rotation noise from translation
    alpha3: 0.1    # was 0.05 — translation noise from translation
    alpha4: 0.15   # was 0.05 — translation noise from rotation (biggest bump — this is the main rotational-drift term)
    alpha5: 0.1    # was 0.05    

    # Laser model
    laser_model_type: "likelihood_field"
    # Slightly more beams per scan improves correction accuracy per update
    max_beams: 100   # was 60
    laser_min_range: -1.0
    laser_max_range: 12.0 #3.5 # matches TurtleBot3 LiDAR maximum range
    laser_likelihood_max_dist: 2.0

    # Sensor model weights
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2

    # Update settings
    update_min_d: 0.25
    # Update more frequently during turns, so corrections happen sooner   
    update_min_a: 0.1 # was 0.2 (~5.7° instead of ~11.5°)

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0

    # Initial pose
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0

    # Recovery
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    save_pose_rate: 0.5
    do_beamskip: false
    first_map_only: false
